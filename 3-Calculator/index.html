<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="h1">CALCULATOR</h1>
    <div class="hesap-makinesi">
        <div id="ekran">0</div>

        <div class="tuslar">
            <button class="tus fonksiyon" id="temizle-btn">C</button>
            <button class="tus fonksiyon" id="sil-btn">⌫</button>
            <button class="tus fonksiyon" id="yuzde-btn">%</button>
            <button class="tus islem" data-op="/">/</button>

            <button class="tus">7</button>
            <button class="tus">8</button>
            <button class="tus">9</button>
            <button class="tus islem" data-op="*">x</button>

            <button class="tus">4</button>
            <button class="tus">5</button>
            <button class="tus">6</button>
            <button class="tus islem" data-op="-">-</button>

            <button class="tus">1</button>
            <button class="tus">2</button>
            <button class="tus">3</button>
            <button class="tus islem" data-op="+">+</button>

            <button class="tus fonksiyon" id="parantez-btn">()</button>
            <button class="tus">0</button>
            <button class="tus">.</button>
            <button class="tus esittir" id="esittir-btn">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
